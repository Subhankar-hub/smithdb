name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - smithdb-clang-debug
          - smithdb-clang-release
          - smithdb-gcc-debug
          - smithdb-clang-asan

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang g++

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }}

      # Artifacts do not preserve file permissions, so binaries are shipped inside a tarball.
      - name: Package release binaries
        if: matrix.preset == 'smithdb-clang-release'
        run: >
          tar -czf smithdb-linux-x86_64.tar.gz
          -C build/smithdb-clang-release
          smithdb_example smithdb_inspect smithdb_storage_benchmark libsmithdb.a

      - name: Upload release binaries
        if: matrix.preset == 'smithdb-clang-release'
        uses: actions/upload-artifact@v4
        with:
          name: smithdb-linux-x86_64-clang-release
          path: smithdb-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smithdb-linux-x86_64-clang-release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="smithdb-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          mv smithdb-linux-x86_64.tar.gz "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release create "$GITHUB_REF_NAME" "$asset" "$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SmithDB $GITHUB_REF_NAME" \
            --generate-notes
